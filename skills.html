<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <title>ทักษะความสามารถ - คชาพัฒน์ สังศิละ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "Kanit", sans-serif;

            background: #eeeeee;

            color: #111;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 90%;

            max-width: 1100px;

            margin: 40px auto;

            background: white;

            padding: 35px 45px 45px;

            border-radius: 20px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);

        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            text-align: center;

            font-size: 38px;

            color: #173bd1;

            margin-bottom: 35px;

            font-weight: 600;

        }

        h1::before {

            content: "< ";

            color: #ffcc00;

        }

        h1::after {

            content: " >";

            color: #ffcc00;

        }


        /* =========================
           SKILLS
        ========================= */

        .skills {

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 22px;

        }


        /* =========================
           SKILL CARD
        ========================= */

        .skill {

            min-height: 170px;

            border: 2px solid #244bd8;

            border-radius: 18px;

            background: white;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 18px;

            transition: all 0.25s ease;

        }


        .skill:hover {

            transform: translateY(-7px);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.20);

        }


        /* =========================
           ICON
        ========================= */

        .skill img {

            width: 75px;

            height: 75px;

            object-fit: contain;

            margin-bottom: 12px;

        }


        /* =========================
           TEXT
        ========================= */

        .skill p {

            font-size: 18px;

            font-weight: 500;

            color: #222;

            line-height: 1.25;

        }


        /* =========================
           BUTTON
        ========================= */

        .back {

            text-align: center;

            margin: 25px 0 40px;

        }


        .btn {

            display: inline-block;

            padding: 10px 30px;

            background:
                linear-gradient(
                    to right,
                    #1744c9,
                    #517ee9
                );

            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-size: 17px;

            border: 2px solid #173bd1;

            transition: 0.2s;

        }


        .btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.25);

        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align: center;

            color: white;

            background: #10104c;

            padding: 18px;

            font-size: 14px;

        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1000px) {

            .skills {

                grid-template-columns:
                    repeat(4, 1fr);

            }

        }


        /* =========================
           TABLET SMALL
        ========================= */

        @media (max-width: 800px) {

            .container {

                width: 94%;

                padding: 30px 25px;

            }

            .skills {

                grid-template-columns:
                    repeat(3, 1fr);

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {

                width: 95%;

                padding: 25px 15px;

                margin: 20px auto;

            }

            h1 {

                font-size: 30px;

                margin-bottom: 25px;

            }

            .skills {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 15px;

            }

            .skill {

                min-height: 145px;

                padding: 12px;

            }

            .skill img {

                width: 60px;

                height: 60px;

            }

            .skill p {

                font-size: 15px;

            }

        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 380px) {

            .skills {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>
