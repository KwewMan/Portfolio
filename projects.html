<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ผลงาน | Kachapat Sungsila</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: #eeeeee;

            font-family: "Kanit", sans-serif;
        }


        /* =========================
           PAGE
        ========================= */

        .page {
            width: 100%;
            max-width: 1200px;

            min-height: 100vh;

            margin: auto;

            background: white;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            height: 90px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    to right,
                    #0d3f78,
                    #176fd1,
                    #0d3f78
                );
        }


        .header-title {
            color: white;

            font-size: 42px;

            font-weight: 700;

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .header-title::before {
            content: "<";

            color: #ffcc00;

            font-size: 45px;
        }


        .header-title::after {
            content: ">";

            color: #ffcc00;

            font-size: 45px;
        }


        /* =========================
           PROJECT SECTION
        ========================= */

        .projects-section {
            padding: 50px;

            flex: 0;
        }


        .section-title {
            text-align: center;

            font-size: 32px;

            font-weight: 600;

            color: #222;

            margin-bottom: 35px;
        }


        /* =========================
           PROJECT CARD
        ========================= */

        .project-card {
            display: flex;
            flex-direction: column;

            height: 100%;
            min-height: 100%;

            text-decoration: none;

            color: #111;

            background: white;

            border: 2px solid #244bd8;

            border-radius: 18px;

            overflow: hidden;

            transition: 0.25s;
        }


        .project-card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.18);

            color: #111;
        }


        /* =========================
           PROJECT IMAGE
        ========================= */

        .project-image {
            width: 100%;

            height: 230px;

            overflow: hidden;

            background: #eee;

            flex-shrink: 0;
        }


        .project-image img {
            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition: 0.3s;
        }


        .project-card:hover .project-image img {
            transform: scale(1.05);
        }


        /* =========================
           PROJECT CONTENT
        ========================= */

        .project-content {
            padding: 18px;

            text-align: center;

            display: flex;
            flex-direction: column;

            flex: 1;
        }


        /* =========================
           PROJECT TITLE
        ========================= */

        .project-title {
            font-size: 24px;

            font-weight: 600;

            color: #244bd8;

            margin-bottom: 5px;

            line-height: 1.4;

            /*
                ทำให้พื้นที่ชื่อเท่ากัน
                แม้ชื่อจะมีความยาวต่างกัน
            */
            min-height: 34px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =========================
           PROJECT DESCRIPTION
        ========================= */

        .project-description {
            font-size: 16px;

            color: #555;

            line-height: 1.6;

            margin: 0;

            /*
                ทำให้คำอธิบายกินพื้นที่เท่ากัน
            */
            min-height: 52px;

            display: flex;

            align-items: flex-start;

            justify-content: center;

            text-align: center;
        }


        /* =========================
           CLICK BUTTON
        ========================= */

        .click-text {
            display: inline-block;

            margin-top: auto;

            align-self: center;

            padding: 6px 18px;

            background: #244bd8;

            color: white;

            border-radius: 20px;

            font-size: 14px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-area {
            text-align: center;

            padding: 0 50px 50px;
        }


        .back-button {
            display: inline-block;

            padding: 10px 25px;

            border: 2px solid #244bd8;

            border-radius: 25px;

            color: #244bd8;

            text-decoration: none;

            transition: 0.2s;
        }


        .back-button:hover {
            background: #244bd8;

            color: white;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            width: 100%;

            text-align: center;

            padding: 20px;

            background: #10104c;

            color: white;

            font-size: 14px;

            margin-top: auto;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 767px) {

            .header {
                height: 75px;
            }


            .header-title {
                font-size: 30px;
            }


            .header-title::before,
            .header-title::after {
                font-size: 34px;
            }


            .projects-section {
                padding: 30px 20px;
            }


            .section-title {
                font-size: 27px;
            }


            .project-image {
                height: 200px;
            }


            /*
                บนมือถือให้ความสูง
                ของรายละเอียดเท่ากันเหมือน Desktop
            */

            .project-content {
                min-height: 175px;

                padding: 16px;
            }


            .project-title {
                font-size: 22px;

                min-height: 32px;
            }


            .project-description {
                font-size: 15px;

                min-height: 48px;
            }


            .back-area {
                padding: 0 20px 30px;
            }


            .footer {
                padding: 15px;

                font-size: 13px;
            }

        }


    </style>

</head>


<body>


    <div class="page">


        <!-- =========================
             HEADER
        ========================= -->

        <header class="header">

            <div class="header-title">
                ผลงาน
            </div>

        </header>


        <!-- =========================
             PROJECTS
        ========================= -->

        <section class="projects-section">

            <div class="row g-4">


                <!-- =========================
                     BLENDER
                ========================= -->

                <div class="col-lg-4 col-md-6">

                    <a
                        href="blender.html"
                        class="project-card"
                    >


                        <div class="project-image">

                            <img
                                src="https://www.pngmart.com/files/23/Blender-Logo-PNG-HD-Isolated.png"
                                alt="ผลงาน Blender"
                            >

                        </div>


                        <div class="project-content">


                            <div class="project-title">
                                การออกแบบด้วยโปรแกรม Blender
                            </div>


                            <p class="project-description">
                                ผลงานการออกแบบ 3D
                                ด้วยโปรแกรม Blender
                            </p>


                            <span class="click-text">
                                ดูรายละเอียด →
                            </span>


                        </div>


                    </a>

                </div>


                <!-- =========================
                     MY BP
                ========================= -->

                <div class="col-lg-4 col-md-6">

                    <a
                        href="MyBP.html"
                        class="project-card"
                    >


                        <div class="project-image">

                            <img
                                src="logoMyBp.png"
                                alt="App My BP"
                            >

                        </div>


                        <div class="project-content">


                            <div class="project-title">
                                My BP
                            </div>


                            <p class="project-description">
                                บันทึกสุขภาพความดัน
                            </p>


                            <span class="click-text">
                                ดูรายละเอียด →
                            </span>


                        </div>


                    </a>

                </div>


                <!-- =========================
                     WebAPP
                ========================= -->

                <div class="col-lg-4 col-md-6">

                    <a
                        href="wepapp.html"
                        class="project-card"
                    >


                        <div class="project-image">

                            <img
                                src="sheet+script.png"
                                alt="ผลงาน Web Application"
                            >

                        </div>


                        <div class="project-content">


                            <div class="project-title">
                                Web Application
                            </div>


                            <p class="project-description">
                                ระบบบันทึกข้อมูลอุปกรณ์
                            </p>


                            <span class="click-text">
                                ดูรายละเอียด →
                            </span>


                        </div>


                    </a>

                </div>


                <!-- =========================
                     เพิ่มผลงานอื่นตรงนี้
                ========================= -->


            </div>

        </section>


        <!-- =========================
             BACK BUTTON
        ========================= -->

        <div class="back-area">

            <a
                href="index.html"
                class="back-button"
            >
                ← กลับหน้าหลัก
            </a>

        </div>


        <!-- =========================
             FOOTER
        ========================= -->

        <footer class="footer">

            © 2026 Kachapat Sungsila
            | Projects

        </footer>


    </div>


    <!-- =========================
         BOOTSTRAP JS
    ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
